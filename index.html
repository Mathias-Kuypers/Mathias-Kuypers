<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Portfolio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #111;
    }

    header {
      padding: 2rem;
      text-align: center;
      background: white;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    header p {
      margin-top: 0.5rem;
      color: #666;
    }

    .container {
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .card {
      background: white;
      padding: 1rem;
      border-radius: 10px;
      transition: 0.2s;
      text-decoration: none;
      color: black;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      border-radius: 6px;
    }

    .card h3 {
      margin: 0.5rem 0 0;
      font-size: 1rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>Jouw Naam</h1>
    <p>Kunstenaar / Docent / Maker</p>
  </header>

  <div class="container">
    <h2>Portfolio</h2>

    <div class="grid">

      <a href="#" class="card">
        <img src="https://via.placeholder.com/400" alt="">
        <h3>Project 1</h3>
      </a>

      <a href="#" class="card">
        <img src="https://via.placeholder.com/400" alt="">
        <h3>Project 2</h3>
      </a>

      <a href="#" class="card">
        <img src="https://via.placeholder.com/400" alt="">
        <h3>Project 3</h3>
      </a>

    </div>
  </div>

  <footer>
    © 2026 — jouw naam
  </footer>

</body>
</html>
